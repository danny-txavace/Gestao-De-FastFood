<p-dialog
  [(visible)]="visible"
  [modal]="true"
  [style]="{ width: '25rem' }"
  position="center"
>
  <ng-template #header>
    <div class="inline-flex items-center justify-center">
      <h2>{{ 'DIALOGS.OPEN_CASH.TITLE' | translate }}</h2>
    </div>
  </ng-template>
  <span class="login_subtitle block mb-5">{{ 'DIALOGS.OPEN_CASH.INFO' | translate }}</span>
  <form
    [formGroup]="form"
    class="my-1"
  >
    <p-floatlabel variant="on" class="w-full">
      <p-iconfield>
        <p-inputicon class="pi pi-money-bill" />
        <p-inputnumber
        [min]="0"
        inputId="on_amount"
        autocomplete="off"
        class="w-full"
        formControlName="amount"/>
      </p-iconfield>
      <label for="on_amount">{{ 'DIALOGS.OPEN_CASH.AMOUNT' | translate }}</label>
    </p-floatlabel>
  </form>
  <ng-template #footer>
    <div class="mt-2 w-full flex justify-between items-center">
      <button pRipple type="button"
        class="btn_cancel"
        (click)="visible = false"
      >
        {{ 'DIALOGS.ACTIONS.CANCEL' | translate }}
      </button>

      <span class="default_btn">
        <button pRipple type="submit"
          class="cursor-pointer"
          [disabled]="showLoader"
          (click)="onSubmit()"
        >
          @if (showLoader) {
            <div class="loader">
              <span class="small_loader"></span>
            </div>
          }
          @else {
            {{ 'DIALOGS.ACTIONS.CONFIRM' | translate }}
          }
        </button>
      </span>
    </div>
  </ng-template>
</p-dialog>
