<p-dialog
  [(visible)]="visible"
  [modal]="true"
  [maximizable]="true"
  [style]="{ width: '60dvw' }"
  position="top"
>
  <ng-template #header>
    <div class="inline-flex items-center justify-center">
      <h2>{{ 'DIALOGS.INGREDIENTS.TITLE' | translate }} : <span class="text-green-600">{{ itemName }}</span></h2>
    </div>
  </ng-template>

  <section class="w-full simple_card ag_grid">
    <article class="w-full mb-1 mt-3 grid gap-3 min-sm:flex min-sm:justify-between min-sm:items-center">
      <p-floatlabel variant="on" class="w-full xl:w-1/3 lg:w-1/3 min-sm:w-1/2 order-1 max-sm:order-2">
        <p-iconfield>
          <p-inputicon class="pi pi-search" />
          <input type="text" pInputText id="lbl_search" [(ngModel)]="searchInput" autocomplete="off" (input)="onSearch()" />
        </p-iconfield>
          <label for="lbl_search">
            {{ 'COMMON.SEARCH' | translate}}
          </label>
      </p-floatlabel>

      <div class="default_btn flex gap-3 order-2 max-sm:order-1">
        <button pRipple type="button" (click)="onOpenDialog()">
          {{ 'DIALOGS.INGREDIENTS.ADD_NEW.BTN' | translate }}
        </button>
      </div>
    </article>

    @if (tableLoading)
    {
      <div class="loader">
        <span class="card_loader"></span>
      </div>
    }
    @else
    {
      <ag-grid-angular
        class="ag_theme_alpine w-full"
        [rowData]="rowData"
        [columnDefs]="columnDefs"
        [animateRows]="true"
        [domLayout]="'autoHeight'"
        [pagination]="false"
        [headerHeight]="headerHeight"
        [rowHeight]="rowHeight"
        [rowSelection]="rowSelection"
        [gridOptions]="gridOptions"
        (gridReady)="onGridReady($event)"
      >
      </ag-grid-angular>
    }
  </section>

  <ng-template #footer>
    <div class="mt-2 w-full flex justify-end items-center">
      <span class="default_btn">
        <button pRipple type="button"
          class="cursor-pointer"
          (click)="visible = false"
        >
          Ok
        </button>
      </span>
    </div>
  </ng-template>
</p-dialog>
