<main class="w-full mt-3 grid gap-10">
  <section class="w-full flex gap-3">
    <div class="w-full default_card">
        <h2>
          {{ 'INGREDIENTS.TOTAL_ITEMS' | translate }}
        </h2>
        <h3 #countUpQty_active>0</h3>
      </div>
      <div class="w-full default_card">
        <h2>
          {{ 'INGREDIENTS.TOTAL_ACTIVE_QTY' | translate }}
        </h2>
        <h3 #countUpQty_totalActiveQty>0</h3>
      </div>
      <div class="w-full default_card">
        <h2>
          {{ 'INGREDIENTS.TOTAL_INACTIVE_QTY' | translate }}
        </h2>
        <h3 #countUpQty_inactive>0</h3>
      </div>
      <div class="w-full default_card">
        <article class="flex justify-between">
          <h2 class="text-yellow-600!">
            {{ 'INGREDIENTS.NEAR_EXPIRY' | translate }}
          </h2>
        </article>
        <h3 class="text-yellow-600!" #countUpQty_nearExpiry>0</h3>
      </div>
      <div class="w-full default_card">
        <article class="flex justify-between">
          <h2 class="text-red-600!">
            {{ 'INGREDIENTS.EXPIRED' | translate }}
          </h2>
        </article>
        <h3 class="text-red-600!" #countUpQty_expired>0</h3>
      </div>
  </section>
  <section class="w-full simple_card ag_grid">
    <article class="w-full mb-1 grid gap-3 min-sm:flex min-sm:justify-between min-sm:items-center">
      <p-floatlabel variant="on" class="w-full xl:w-1/3 lg:w-1/3 min-sm:w-1/2 order-1 max-sm:order-2">
        <p-iconfield>
          <p-inputicon class="pi pi-search" />
          <input type="text" pInputText id="lbl_search" [(ngModel)]="searchInput" autocomplete="off" (input)="onSearch()" />
        </p-iconfield>
          <label for="lbl_search">
            {{ 'COMMON.SEARCH' | translate }}
          </label>
      </p-floatlabel>

      <div class="default_btn flex gap-3 order-2 max-sm:order-1">
        <button pRipple type="button" (click)="onOpenDialog()">
          {{ 'INGREDIENTS.ADD_NEW_INGREDIENT' | translate }}
        </button>
      </div>
    </article>

    @if (tableLoading)
    {
      <div class="loader">
        <span class="card_loader"></span>
      </div>
    }
    @else
    {
      <ag-grid-angular
        class="ag_theme_alpine w-full"
        [rowData]="rowData"
        [columnDefs]="columnDefs"
        [animateRows]="true"
        [domLayout]="'autoHeight'"
        [pagination]="false"
        [headerHeight]="headerHeight"
        [rowHeight]="rowHeight"
        [rowSelection]="rowSelection"
        [gridOptions]="gridOptions"
        (gridReady)="onGridReady($event)"
      >
      </ag-grid-angular>
    }
  </section>
</main>
